services:
  app:
    build: ./backend
    ports:
      - "5001:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/quizapp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
    depends_on:
      - mongo
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - app

  mongo:
    image: mongo:6
    container_name: quiz-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: quiz-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:

# Commands
#   docker compose up --build      → app at http://localhost:3001
#   docker compose logs app
